    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 🔥 PREMIUM ENGINES ADDED 🔥 -->
    <!-- IndexedDB Engine for Unlimited Storage Capacity -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <!-- JSZip Engine for Professional Folder Downloads -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Outfit:wght@300;500;700;900&display=swap');

        /* -------------------------------------------
           THEME ENGINE CSS & ANIMATIONS
        -------------------------------------------- */
        :root {
            --bg-main: #03050a; --bg-panel: rgba(10, 15, 26, 0.75); --border-glow: rgba(0, 243, 255, 0.2);
            --text-primary: #e2e8f0; --accent-main: #00f3ff; --accent-shadow: rgba(0, 243, 255, 0.6);
            --btn-danger: #ff0055; --bg-card: rgba(15, 23, 42, 0.6); --orb-1: rgba(0, 243, 255, 0.15); --orb-2: rgba(112, 0, 255, 0.15);
        }
        [data-theme="crimson"] {
            --bg-main: #0a0101; --bg-panel: rgba(26, 5, 5, 0.75); --border-glow: rgba(255, 42, 42, 0.2);
            --text-primary: #ffe5e5; --accent-main: #ff2a2a; --accent-shadow: rgba(255, 42, 42, 0.6);
            --btn-danger: #ffea00; --bg-card: rgba(40, 10, 10, 0.6); --orb-1: rgba(255, 42, 42, 0.15); --orb-2: rgba(255, 150, 0, 0.15);
        }
        [data-theme="cyberpunk"] {
            --bg-main: #0d0221; --bg-panel: rgba(20, 5, 40, 0.75); --border-glow: rgba(253, 241, 0, 0.2);
            --text-primary: #f0e6ff; --accent-main: #fdf100; --accent-shadow: rgba(253, 241, 0, 0.6);
            --btn-danger: #ff007f; --bg-card: rgba(40, 10, 60, 0.6); --orb-1: rgba(253, 241, 0, 0.15); --orb-2: rgba(255, 0, 127, 0.15);
        }
        [data-theme="solar"] {
            --bg-main: #0a0700; --bg-panel: rgba(26, 20, 0, 0.75); --border-glow: rgba(255, 170, 0, 0.2);
            --text-primary: #fff2cc; --accent-main: #ffaa00; --accent-shadow: rgba(255, 170, 0, 0.6);
            --btn-danger: #ff3300; --bg-card: rgba(45, 30, 0, 0.6); --orb-1: rgba(255, 170, 0, 0.15); --orb-2: rgba(255, 51, 0, 0.15);
        }
        [data-theme="ocean"] {
            --bg-main: #000a14; --bg-panel: rgba(0, 20, 40, 0.75); --border-glow: rgba(0, 255, 204, 0.2);
            --text-primary: #ccfff5; --accent-main: #00ffcc; --accent-shadow: rgba(0, 255, 204, 0.6);
            --btn-danger: #ff0066; --bg-card: rgba(0, 30, 50, 0.6); --orb-1: rgba(0, 255, 204, 0.15); --orb-2: rgba(0, 102, 255, 0.15);
        }
        
        body { font-family: 'Outfit', sans-serif; overflow-x: hidden; }
        .qv-bg { background-color: var(--bg-main); color: var(--text-primary); transition: background-color 0.5s ease; }
        .qv-panel { background-color: var(--bg-panel); border: 1px solid var(--border-glow); backdrop-filter: blur(25px); }
        .qv-text-accent { color: var(--accent-main); text-shadow: 0 0 15px var(--accent-shadow); }
        .qv-border-accent { border-color: var(--accent-main); box-shadow: 0 0 20px var(--accent-shadow); }
        .qv-btn-primary { background-color: var(--accent-main); color: #000; box-shadow: 0 0 15px var(--accent-shadow); transition: all 0.3s; }
        .qv-btn-primary:hover:not(:disabled) { filter: brightness(1.2); transform: translateY(-3px) scale(1.02); box-shadow: 0 0 30px var(--accent-shadow); }
        .qv-btn-danger { background-color: transparent; border: 1px solid var(--btn-danger); color: var(--btn-danger); transition: all 0.3s; }
        .qv-btn-danger:hover:not(:disabled) { background-color: var(--btn-danger); color: #fff; box-shadow: 0 0 25px var(--btn-danger); transform: translateY(-2px); }
        
        .qv-card { background-color: var(--bg-card); border: 1px solid var(--border-glow); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden; }
        .qv-card:hover { border-color: var(--accent-main); box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 0 20px var(--border-glow); transform: translateY(-8px) scale(1.03); z-index: 10; }
        
        /* Shimmer Animation for Cards */
        .qv-card::before {
            content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.05), transparent);
            transform: skewX(-20deg); transition: none; z-index: 1; pointer-events: none;
        }
        .qv-card:hover::before { animation: cardShimmer 1s ease-in-out infinite; }
        @keyframes cardShimmer { 0% { left: -150%; } 100% { left: 200%; } }

        /* Loading Bar Shimmer */
        @keyframes shimmerSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        .shimmer-bar { position: relative; overflow: hidden; }
        .shimmer-bar::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmerSlide 1.5s infinite;
        }

        /* Inputs */
        .qv-input { background: rgba(0,0,0,0.5); border: 1px solid var(--border-glow); color: white; transition: all 0.3s; }
        .qv-input:focus { border-color: var(--accent-main); box-shadow: 0 0 15px var(--accent-shadow); outline: none; }

        /* Premium Animations */
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }
        .animate-float { animation: float 6s ease-in-out infinite; }
        
        @keyframes orbDrift { 0% { transform: translate(0, 0) scale(1); } 33% { transform: translate(30px, -50px) scale(1.1); } 66% { transform: translate(-20px, 20px) scale(0.9); } 100% { transform: translate(0, 0) scale(1); } }
        .orb-1 { position: absolute; width: 500px; height: 500px; background: var(--orb-1); border-radius: 50%; filter: blur(100px); animation: orbDrift 10s infinite alternate; top: -10%; left: -10%; z-index: 0; pointer-events: none; }
        .orb-2 { position: absolute; width: 400px; height: 400px; background: var(--orb-2); border-radius: 50%; filter: blur(100px); animation: orbDrift 12s infinite alternate-reverse; bottom: -10%; right: -10%; z-index: 0; pointer-events: none; }

        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 15px var(--border-glow); } 50% { box-shadow: 0 0 30px var(--accent-shadow); } }
        .animate-glow { animation: pulseGlow 2.5s infinite; }

        @keyframes slideUpFade { from { opacity: 0; transform: translateY(40px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .slide-up { animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }

        @keyframes termPop { 0% { opacity: 0; transform: translateX(-10px); } 100% { opacity: 1; transform: translateX(0); } }
        .term-animate { animation: termPop 0.3s ease-out forwards; }

        @keyframes sweepGradient { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        .text-gradient-animate {
            background: linear-gradient(90deg, var(--accent-main), #fff, var(--accent-main));
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: sweepGradient 3s linear infinite;
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-main); }
    </style>
</head>

                Lock: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
                ArrowLeft: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>,
                Archive: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>
            };
            return icons[name] || null;
        };

        function QuantumVault() {
            // 🔥 BULLETPROOF DUAL-CORE STORAGE ENGINE 🔥
            // Uses both LocalForage and LocalStorage Backup to prevent Data Loss on Port Change
            const [vaults, setVaults] = useState([]);
            const [allFilesMeta, setAllFilesMeta] = useState([]); 
            const [isDataLoaded, setIsDataLoaded] = useState(false);

            useEffect(() => {
                const loadData = async () => {
                    try {
                        let savedVaults = await localforage.getItem('quantum_vaults');
                        let savedMeta = await localforage.getItem('quantum_files_meta');
                        
                        // Fallback mechanism to prevent data loss on file:// protocols or port changes
                        if (!savedVaults) {
                            const backupVaults = localStorage.getItem('qv_vaults_backup');
                            if (backupVaults) savedVaults = JSON.parse(backupVaults);
                        }
                        if (!savedMeta) {
                            const backupMeta = localStorage.getItem('qv_meta_backup');
                            if (backupMeta) savedMeta = JSON.parse(backupMeta);
                        }

                        if (savedVaults) setVaults(savedVaults);
                        if (savedMeta) setAllFilesMeta(savedMeta);
                    } catch (err) {
                        console.error("Database Load Error:", err);
                    }
                    setIsDataLoaded(true);
                };
                loadData();
            }, []);

            // Dual Sync Helpers
            const syncVaults = async (newVaults) => {
                setVaults(newVaults);
                try { await localforage.setItem('quantum_vaults', newVaults); } catch(e){}
                try { localStorage.setItem('qv_vaults_backup', JSON.stringify(newVaults)); } catch(e){}
            };

            const syncMeta = async (newMeta) => {
                setAllFilesMeta(newMeta);
                try { await localforage.setItem('quantum_files_meta', newMeta); } catch(e){}
                try { localStorage.setItem('qv_meta_backup', JSON.stringify(newMeta)); } catch(e){}
            };

            const [currentView, setCurrentView] = useState('login'); 
            const [currentVault, setCurrentVault] = useState(null);
            const [theme, setTheme] = useState('quantum');
            const [toast, setToast] = useState({ show: false, msg: '', type: 'info' });
            
            // Decoupled Terminal Log (No longer disappears with toast)
            const [terminalLog, setTerminalLog] = useState("System online and waiting for instructions.");
            const [logKey, setLogKey] = useState(0);

            const [vaultNameInput, setVaultNameInput] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [isCreateMode, setIsCreateMode] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [activeTab, setActiveTab] = useState('all'); 
            
            // FOLDER STATE
            const [activeFolder, setActiveFolder] = useState(null);

            const [uploadType, setUploadType] = useState(null); 
            const [snippetTitle, setSnippetTitle] = useState('');
            const [snippetContent, setSnippetContent] = useState('');
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [newPassword, setNewPassword] = useState('');
            const [isUploading, setIsUploading] = useState(false);
            const [isZipping, setIsZipping] = useState(false);
            const [isDestroying, setIsDestroying] = useState(false);
            
            const fileInputRef = useRef(null);

            useEffect(() => { document.body.setAttribute('data-theme', theme); }, [theme]);
            useEffect(() => { setActiveFolder(null); }, [activeTab, searchQuery]);

            // Formatting Size Nicely
            const formatSize = (bytes) => {
                if (bytes === 0 || !bytes) return '< 1 KB';
                if (bytes < 1024) return '< 1 KB';
                return Math.round(bytes / 1024) + ' KB';
            };

            const vaultFiles = allFilesMeta.filter(f => f.vaultName === currentVault?.vaultName);
            let itemsToRender = [];

            if (searchQuery) {
                itemsToRender = vaultFiles.filter(f => f.fileName.toLowerCase().includes(searchQuery.toLowerCase()) || (f.folderPath && f.folderPath.toLowerCase().includes(searchQuery.toLowerCase()))).map(f => ({...f, type: 'file'}));
            } else if (activeFolder) {
                itemsToRender = vaultFiles.filter(f => f.folderPath === activeFolder).map(f => ({...f, type: 'file'}));
            } else {
                const uniqueFolders = Array.from(new Set(vaultFiles.filter(f => f.folderPath).map(f => f.folderPath)));
                const folderItems = uniqueFolders.map(folderName => ({
                    id: 'folder-' + folderName, type: 'folder', name: folderName,
                    fileCount: vaultFiles.filter(f => f.folderPath === folderName).length,
                    size: vaultFiles.filter(f => f.folderPath === folderName).reduce((acc, curr) => acc + (curr.size || 0), 0)
                }));
                const rootFileItems = vaultFiles.filter(f => !f.folderPath).map(f => ({...f, type: 'file'}));

                if (activeTab === 'all') itemsToRender = [...folderItems, ...rootFileItems];
                else if (activeTab === 'folders') itemsToRender = folderItems;
                else if (activeTab === 'images') itemsToRender = rootFileItems.filter(f => f.fileType.includes('image'));
                else if (activeTab === 'codes') itemsToRender = rootFileItems.filter(f => f.fileType.includes('code') || f.fileType.includes('text') || f.fileType.includes('json'));
            }

            const totalBytes = vaultFiles.reduce((acc, curr) => acc + (curr.size || 0), 0);
            const MAX_STORAGE = 10 * 1024 * 1024 * 1024; 
            const storagePercent = Math.min((totalBytes / MAX_STORAGE) * 100, 100).toFixed(4);
            const displayGB = (totalBytes / (1024 * 1024 * 1024)).toFixed(6);

            const showToast = (msg, type = 'info', updateTerminal = true) => {
                setToast({ show: true, msg, type });
                if(updateTerminal) {
                    setTerminalLog(msg); 
                    setLogKey(prev => prev + 1);
                }
                setTimeout(() => setToast({ show: false, msg: '', type: 'info' }), 4000);
            };

            const handleAuthSubmit = (e) => {
                e.preventDefault();
                if (!vaultNameInput.trim() || !passwordInput.trim()) return showToast("Identity and Passkey are required!", "error");

                const existingVault = vaults.find(v => v.vaultName.toLowerCase() === vaultNameInput.toLowerCase().trim());

                if (isCreateMode) {
                    if (existingVault) return showToast("Access Denied: This Vault Identity already exists!", "error");
                    const newVault = { id: Math.random().toString(), vaultName: vaultNameInput.trim(), password: passwordInput };
                    syncVaults([...vaults, newVault]);
                    setCurrentVault(newVault); setCurrentView('dashboard'); setVaultNameInput(''); setPasswordInput('');
                    showToast("Vault initialized successfully! Welcome.", "success");
                } else {
                    if (!existingVault) return showToast("Access Denied: Vault not found.", "error");
                    if (existingVault.password !== passwordInput) return showToast("Security Alert: Invalid Passkey!", "error");
                    setCurrentVault(existingVault); setCurrentView('dashboard'); setVaultNameInput(''); setPasswordInput('');
                    showToast(`Authentication Successful. Welcome back, ${existingVault.vaultName}`, "success");
                }
            };

            // 🔥 BULLETPROOF BASE64 UPLOAD ENGINE 🔥
            const processFileUploads = async (filesArray) => {
                if(filesArray.length === 0) return;
                setIsUploading(true);
                let successCount = 0; let skippedCount = 0; let newFilesMeta = [];
                
                const files = Array.from(filesArray);

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    if (file.size > 100 * 1024 * 1024) { skippedCount++; continue; }

                    const fileId = Math.random().toString(36).substring(2, 15);
                    const relativePath = file.webkitRelativePath || file.name;
                    const rootFolderName = file.webkitRelativePath ? file.webkitRelativePath.split('/')[0] : '';

                    try {
                        // Store exactly as Base64 Data URL to guarantee 0 bytes lost.
                        const base64Data = await new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = e => resolve(e.target.result);
                            reader.onerror = e => reject(e);
                            reader.readAsDataURL(file);
                        });
                        
                        await localforage.setItem(`file_data_${fileId}`, base64Data);
                        
                        newFilesMeta.push({
                            id: fileId, vaultName: currentVault.vaultName, fileName: file.name, 
                            fileType: file.type || 'application/octet-stream', 
                            folderPath: uploadType === 'folder' ? (rootFolderName || 'Uploaded_Folder') : '', 
                            fullPath: relativePath, 
                            size: file.size, uploadedAt: new Date().toISOString()
                        });
                        successCount++;
                    } catch (err) {
                        console.error("Database Save Error:", err);
                        skippedCount++;
                    }
                }
                
                if (newFilesMeta.length > 0) {
                    await syncMeta([...allFilesMeta, ...newFilesMeta]);
                }

                setIsUploading(false); setUploadType(null);
                if(successCount > 0) showToast(`${successCount} items securely encrypted & uploaded.`, "success");
                if(skippedCount > 0) showToast(`${skippedCount} items skipped (Error or > 100MB).`, "error");
            };

            const handleSaveSnippet = async () => {
                if (!snippetTitle.trim() || !snippetContent.trim()) return showToast("Snippet requires both title and content.", "error");
                setIsUploading(true);
                const fileId = Math.random().toString(36).substring(2, 15);
                const newFileMeta = {
                    id: fileId, vaultName: currentVault.vaultName, 
                    fileName: snippetTitle + (snippetTitle.includes('.') ? '' : '.txt'), 
                    fileType: 'code/snippet', folderPath: '', fullPath: snippetTitle, size: snippetContent.length
                };
                
                try {
                    // Base64 conversion for snippets
                    const base64Data = "data:text/plain;base64," + btoa(unescape(encodeURIComponent(snippetContent)));
                    await localforage.setItem(`file_data_${fileId}`, base64Data);
                    
                    setTimeout(async () => {
                        await syncMeta([...allFilesMeta, newFileMeta]);
                        showToast("Snippet saved and encrypted.", "success");
                        setUploadType(null); setSnippetTitle(''); setSnippetContent('');
                        setIsUploading(false);
                    }, 500);
                } catch (err) {
                    showToast("Failed to save snippet securely.", "error");
                    setIsUploading(false);
                }
            };

            const handleDeleteFile = async (e, id) => {
                e.stopPropagation();
                await localforage.removeItem(`file_data_${id}`); 
                await syncMeta(allFilesMeta.filter(f => f.id !== id));
                showToast("File permanently deleted.", "success"); 
            };

            const handleDeleteFolder = async (e, folderName) => {
                e.stopPropagation();
                const confirmDelete = window.confirm(`Are you sure you want to completely destroy the folder '${folderName}' and all its contents?`);
                if(!confirmDelete) return;
                
                const filesToDelete = allFilesMeta.filter(f => f.vaultName === currentVault.vaultName && f.folderPath === folderName);
                for (const f of filesToDelete) {
                    await localforage.removeItem(`file_data_${f.id}`);
                }

                await syncMeta(allFilesMeta.filter(f => !(f.vaultName === currentVault.vaultName && f.folderPath === folderName)));

                setIsDestroying(true);
                
                const filesToDelete = allFilesMeta.filter(f => f.vaultName === currentVault.vaultName);
                for (const f of filesToDelete) {
                    await localforage.removeItem(`file_data_${f.id}`);
                }

                setTimeout(async () => {
                    await syncMeta(allFilesMeta.filter(f => f.vaultName !== currentVault.vaultName));
                    await syncVaults(vaults.filter(v => v.id !== currentVault.id));

                    showToast("Vault and all associated data completely destroyed.", "success");
                    setIsDestroying(false);
                }, 1500);
            };

                e.stopPropagation();
                const fileDataUrl = await localforage.getItem(`file_data_${fileMeta.id}`);
                if (!fileDataUrl) return showToast("File data missing or corrupted.", "error");

                const a = document.createElement('a');
                a.href = fileDataUrl; a.download = fileMeta.fileName; document.body.appendChild(a); a.click(); document.body.removeChild(a);
            };

                const filesToZipMeta = allFilesMeta.filter(f => f.vaultName === currentVault.vaultName && f.folderPath === folderName);

                    const zip = new JSZip();
                    for (const fileMeta of filesToZipMeta) {
                        const fileDataUrl = await localforage.getItem(`file_data_${fileMeta.id}`);
                        if (!fileDataUrl) continue;

                        // Preserve EXACT path hierarchy for IDEs

                        // Safely extract Base64 payload
                        const dataSplit = fileDataUrl.split(',');
                        const base64Data = dataSplit.length > 1 ? dataSplit[1] : dataSplit[0];
                        
                        zip.file(pathInZip, base64Data, {base64: true});
                    }

                    const content = await zip.generateAsync({type: "blob", compression: "DEFLATE", compressionOptions: { level: 6 }});
                    const url = URL.createObjectURL(content);
                    const a = document.createElement('a');
                    a.href = url; a.download = `${folderName}.zip`; 
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    
                    showToast(`Folder perfectly zipped & downloaded!`, 'success');
                } catch (err) {

                                            </div>
                                            )}

                                            <div className="w-20 h-20 rounded-2xl bg-black flex items-center justify-center mt-5 mb-5 group-hover:scale-110 transition-transform shadow-inner border border-slate-800/80 group-hover:qv-border-accent">
                                                {item.fileType.includes('image') ? <Icon name="ImageIcon" className="text-cyan-400" size={32}/> : 
                                                item.fileType.includes('code') || item.fileType.includes('text') || item.fileType.includes('json') || item.fileName.startsWith('.') ? <Icon name="FileCode" className="text-emerald-400" size={32}/> : 
                                                <Icon name="FileText" className="text-purple-400" size={32}/>}
                                            </div>
                                            
                                            <h4 className="text-xs font-bold text-slate-200 truncate w-full mb-2 tracking-wide" title={item.fileName}>{item.fileName}</h4>
                                            <span className="text-[9px] text-slate-500 font-black uppercase tracking-[0.2em]">{formatSize(item.size)}</span>
                                            
                                            <div className="absolute inset-0 bg-black/80 backdrop-blur-sm opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-4 z-20">
                                            <button onClick={(e) => downloadFile(e, item)} className="p-3 rounded-xl qv-btn-primary transition-all hover:scale-110"><Icon name="Download" size={18}/></button>
                                            <button onClick={(e) => handleDeleteFile(e, item.id)} className="p-3 rounded-xl bg-red-600 hover:bg-red-500 text-white shadow-[0_0_15px_rgba(255,0,0,0.5)] transition-all hover:scale-110"><Icon name="Trash2" size={18}/></button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                            )}
                        </div>
                        </div>
                    </div>
                    </div>
                )}

                {/* UPLOAD MODALS */}
                {uploadType && (
                    <div className="fixed inset-0 bg-black/80 backdrop-blur-xl z-50 flex items-center justify-center p-4 animate-in fade-in duration-300">
                    <div className="qv-panel rounded-[2.5rem] w-full max-w-lg p-10 relative shadow-[0_0_80px_rgba(0,0,0,0.8)]">
                        <button onClick={() => setUploadType(null)} disabled={isUploading} className="absolute top-8 right-8 text-slate-500 hover:text-white transition-colors bg-black/50 p-2 rounded-full"><Icon name="X" size={20}/></button>
                        
                        <h2 className="text-2xl font-black mb-8 flex items-center gap-4 uppercase tracking-widest text-white">
                        {uploadType === 'snippet' ? <><Icon name="FileCode" className="qv-text-accent" size={28}/> Secure Code</> : 
                        uploadType === 'folder' ? <><Icon name="FolderPlus" className="qv-text-accent" size={28}/> Upload Folder</> : 
                        <><Icon name="UploadCloud" className="qv-text-accent" size={28}/> Upload File</>}
                        </h2>

                        {uploadType === 'snippet' ? (
                        <div className="space-y-6">
                            <div>
                            <input type="text" placeholder="e.g. index.js" value={snippetTitle} onChange={(e) => setSnippetTitle(e.target.value)}
                                className="w-full qv-input rounded-xl px-5 py-3.5 text-sm font-bold" />
                            </div>
                            <div>
                            <textarea placeholder="Paste top secret code here..." value={snippetContent} onChange={(e) => setSnippetContent(e.target.value)}
                                className="w-full h-56 qv-input rounded-xl px-5 py-4 font-mono text-sm text-emerald-400 resize-none leading-relaxed"></textarea>
                            </div>
                            <button onClick={handleSaveSnippet} disabled={isUploading} className="w-full py-4 qv-btn-primary rounded-xl font-black tracking-widest uppercase flex justify-center items-center gap-2">
                        {isUploading ? <Icon name="Cpu" className="animate-spin" size={20}/> : <Icon name="Lock" size={20}/>}
                        {isUploading ? "Encrypting..." : "Encrypt & Save"}
                        </button>
                    </div>
                    ) : (
                    <div className="space-y-6">
                        <div onClick={() => !isUploading && fileInputRef.current?.click()} className={`border-2 border-dashed border-slate-700 hover:qv-border-accent rounded-[2rem] p-14 flex flex-col items-center justify-center bg-black/40 transition-all group relative cursor-pointer ${isUploading ? 'opacity-50 pointer-events-none border-[var(--accent-main)] bg-[var(--accent-main)]/5' : ''}`}>
                        <input type="file" ref={fileInputRef} className="hidden" multiple={true} {...(uploadType === 'folder' ? { webkitdirectory: "true", directory: "true" } : {})} onChange={(e) => { processFileUploads(e.target.files); e.target.value = null; }} />
                        
                        {isUploading ? (
                            <div className="flex flex-col items-center animate-in fade-in zoom-in duration-300">
                            <Icon name="Cpu" size={60} className="qv-text-accent mb-6 animate-spin" style={{ animationDuration: '2s' }}/>
                                <h3 className="font-black text-white tracking-[0.3em] uppercase text-lg mb-2 text-gradient-animate">Extracting Data...</h3>
                                <div className="w-48 h-1 bg-slate-800 rounded-full overflow-hidden mb-4 border border-slate-700">
                                    <div className="h-full bg-[var(--accent-main)] shimmer-bar w-full"></div>
                                </div>
                                <p className="text-[10px] font-black text-slate-400 tracking-widest uppercase">Please do not close window</p>
                            </div>
                            ) : (
                                <div className="flex flex-col items-center text-center">
                                <div className="w-20 h-20 rounded-full bg-black/50 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform border border-slate-800 group-hover:qv-border-accent">
                                    {uploadType === 'folder' ? <Icon name="FolderPlus" size={35} className="text-slate-400 group-hover:qv-text-accent transition-colors"/> : <Icon name="UploadCloud" size={35} className="text-slate-400 group-hover:qv-text-accent transition-colors"/>}
                                </div>
                                <p className="text-lg font-black text-white tracking-wider uppercase mb-2">Click or Drag Here</p>
                                <p className="text-[10px] font-black tracking-widest uppercase text-slate-500 bg-black/50 px-3 py-1.5 rounded-md border border-slate-800">Max 100MB per file capacity</p>
                                </div>
                            )}
                            </div>
                        </div>
                        )}
                    </div>
                    </div>
                )}

                {/* SETTINGS MODAL */}
                {isSettingsOpen && (
                    <div className="fixed inset-0 bg-black/80 backdrop-blur-xl z-50 flex items-center justify-center p-4 animate-in fade-in">
                    <div className="qv-panel rounded-[2.5rem] w-full max-w-md p-10 relative shadow-[0_0_60px_rgba(0,0,0,0.8)] border border-slate-700">
                        <button onClick={() => setIsSettingsOpen(false)} disabled={isDestroying} className="absolute top-6 right-6 text-slate-500 hover:text-white transition-colors bg-black/50 p-2 rounded-full"><Icon name="X" size={20}/></button>
                        <h2 className="text-2xl font-black mb-10 flex items-center gap-4 tracking-widest uppercase text-white"><Icon name="Key" className="qv-text-accent" size={28}/> Vault Settings</h2>
                        
                        <div className="space-y-8">
                        <div className="p-6 bg-black/40 border border-slate-800 rounded-3xl">
                            <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4 pl-1">Update Security Passkey</h3>
                            <div className="flex gap-3">
                            <input type="password" value={newPassword} onChange={(e) => setNewPassword(e.target.value)}
                                className="w-full qv-input rounded-xl px-4 py-3 text-sm font-bold tracking-widest" placeholder="New Passkey" />
                            <button onClick={() => {
                                if(!newPassword.trim()) return;
                                syncVaults(vaults.map(v => v.id === currentVault.id ? {...v, password: newPassword} : v));
                                setCurrentVault({...currentVault, password: newPassword}); 
                                setNewPassword(''); showToast("Passkey Updated.", "success");
                                }} className="px-6 qv-btn-primary rounded-xl font-black uppercase text-xs tracking-widest">Set</button>
                            </div>
                        </div>

                        <div className="p-6 bg-red-950/30 border border-red-900/50 rounded-3xl relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-1.5 h-full bg-red-600 shadow-[0_0_15px_rgba(255,0,0,0.8)]"></div>
                            <h3 className="text-xs font-black text-red-500 uppercase tracking-widest mb-3 flex items-center gap-2"><Icon name="AlertTriangle" size={18}/> Danger Zone</h3>
                            <p className="text-[10px] text-red-200/50 mb-6 font-bold tracking-wider leading-relaxed uppercase">Permanently destroy this vault and all containing files. This action cannot be reversed.</p>
                            <button onClick={handleDeleteVault} disabled={isDestroying} className="w-full py-4 qv-btn-danger rounded-xl font-black uppercase tracking-[0.2em] flex items-center justify-center gap-3">
                            {isDestroying ? <Icon name="Cpu" className="animate-spin" size={20}/> : <Icon name="Trash2" size={20}/>}
                            {isDestroying ? "Destroying..." : "Destroy Vault"}
                            </button>
                        </div>
                        </div>
                    </div>
                    </div>
                )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<QuantumVault />);
    </script>
</body>
</html>
